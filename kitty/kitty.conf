# ==============================================================================
# FONTS
# ==============================================================================
font_family          JetBrainsMono Nerd Font
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            12.0
disable_ligatures    never

# ==============================================================================
# CURSOR & MOUSE
# ==============================================================================
cursor_shape beam
cursor_blink_interval 0.5

# Hide mouse after 3 seconds of inactivity
mouse_hide_wait      3.0
copy_on_select       yes

# ==============================================================================
# WINDOW LAYOUT & LOOK
# ==============================================================================
window_padding_width 0
background_opacity   0.95
dynamic_background_opacity yes

# Hide native titlebar while keeping resize borders (macOS / Wayland)
hide_window_decorations titlebar-only

# Window sizing & behavior
remember_window_size  yes
initial_window_width  1050
initial_window_height 650
enabled_layouts       Tall, Fat, Grid, Splits, Stack

# Active / Inactive window borders
active_border_color   #89b4fa
inactive_border_color #313244
inactive_text_alpha   0.7

# ==============================================================================
# TAB BAR
# ==============================================================================
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  slanted
active_tab_font_style bold

# ==============================================================================
# SCROLLBACK & PERFORMANCE
# ==============================================================================
scrollback_lines     10000
enable_audio_bell    no
sync_to_monitor      yes

# macOS-specific fix: Treat Option key as Alt/Meta
macos_option_as_alt  yes

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
# Preserve current directory when spawning new windows/tabs
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

# Switch between split panes easily
map ctrl+left        neighboring_window left
map ctrl+right       neighboring_window right
map ctrl+up          neighboring_window up
map ctrl+down        neighboring_window down

# Jump between layouts
map ctrl+shift+l     next_layout

# Quick font sizing
map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# ==============================================================================
# THEME INCLUSION
# ==============================================================================
# Automatically loaded when choosing themes via `kitty +kitten themes`
include current-theme.conf
